<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131d31"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08">
    <circle cx="150" cy="150" r="2" fill="#fff"/>
    <circle cx="300" cy="150" r="2" fill="#fff"/>
    <circle cx="450" cy="150" r="2" fill="#fff"/>
    <circle cx="600" cy="150" r="2" fill="#fff"/>
    <circle cx="750" cy="150" r="2" fill="#fff"/>
    <circle cx="900" cy="150" r="2" fill="#fff"/>
    <circle cx="1050" cy="150" r="2" fill="#fff"/>
    <circle cx="150" cy="300" r="2" fill="#fff"/>
    <circle cx="300" cy="300" r="2" fill="#fff"/>
    <circle cx="450" cy="300" r="2" fill="#fff"/>
    <circle cx="600" cy="300" r="2" fill="#fff"/>
    <circle cx="750" cy="300" r="2" fill="#fff"/>
    <circle cx="900" cy="300" r="2" fill="#fff"/>
    <circle cx="1050" cy="300" r="2" fill="#fff"/>
    <circle cx="150" cy="450" r="2" fill="#fff"/>
    <circle cx="300" cy="450" r="2" fill="#fff"/>
    <circle cx="450" cy="450" r="2" fill="#fff"/>
    <circle cx="600" cy="450" r="2" fill="#fff"/>
    <circle cx="750" cy="450" r="2" fill="#fff"/>
    <circle cx="900" cy="450" r="2" fill="#fff"/>
    <circle cx="1050" cy="450" r="2" fill="#fff"/>
  </g>

  <!-- Glow Effect Circle -->
  <circle cx="200" cy="180" r="200" fill="#22c55e" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="250" fill="#1e3a5f" opacity="0.15" filter="url(#glow)"/>

  <!-- Brand Badge & Logo -->
  <g transform="translate(100, 90)">
    <rect width="64" height="64" rx="18" fill="url(#shieldGrad)"/>
    <!-- Shield Icon -->
    <path d="M32 46s14-7 14-18V18L32 13 18 18v10c0 11 14 18 14 18z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m27 28 4 4 7-7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="84" y="44" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">CCCD Shield</text>
    <rect x="300" y="20" width="150" height="32" rx="16" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="375" y="41" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">100% OFFLINE</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 230)">
    <text x="0" y="0" fill="#ffffff" font-size="52" font-weight="800" line-height="1.2">
      Che mờ &amp; Đóng dấu CCCD
    </text>
    <text x="0" y="65" fill="url(#textGrad)" font-size="52" font-weight="800">
      Chống lừa đảo, cấm vay tiền
    </text>
    <text x="0" y="125" fill="#94a3b8" font-size="22" font-weight="500">
      Xử lý 100% trong RAM trình duyệt • Không gửi ảnh lên máy chủ • Hoàn toàn miễn phí
    </text>
  </g>

  <!-- 3 Trust Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="310" height="74" rx="16" fill="#131d31" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="36" cy="37" r="18" fill="#ef4444" fill-opacity="0.15"/>
    <path d="m28 37 5 5 10-10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="32" fill="#ffffff" font-size="17" font-weight="700">Che số định danh &amp; QR</text>
    <text x="68" y="52" fill="#94a3b8" font-size="13">Làm mờ hoặc che đen</text>

    <!-- Pill 2 -->
    <rect x="335" y="0" width="310" height="74" rx="16" fill="#131d31" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="371" cy="37" r="18" fill="#22c55e" fill-opacity="0.15"/>
    <path d="m363 37 5 5 10-10" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="403" y="32" fill="#ffffff" font-size="17" font-weight="700">Watermark chéo mục đích</text>
    <text x="403" y="52" fill="#94a3b8" font-size="13">Thuê xe, thuê trọ, mở sim</text>

    <!-- Pill 3 -->
    <rect x="670" y="0" width="310" height="74" rx="16" fill="#131d31" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="706" cy="37" r="18" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="m698 37 5 5 10-10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="738" y="32" fill="#ffffff" font-size="17" font-weight="700">Bảo mật tuyệt đối</text>
    <text x="738" y="52" fill="#94a3b8" font-size="13">Ngắt mạng vẫn chạy bình thường</text>
  </g>

  <!-- URL Tag Footer -->
  <g transform="translate(100, 565)">
    <text x="0" y="0" fill="#64748b" font-size="16" font-weight="600">
      Truy cập ngay: <tspan fill="#4ade80">cccd-shield.pages.dev</tspan>
    </text>
  </g>

</svg>
